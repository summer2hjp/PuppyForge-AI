services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # ⚠️ Next.js 的 NEXT_PUBLIC_* 变量必须在 BUILD 时注入
        - NEXT_PUBLIC_API_URL=http://${BACKEND_IP}:${BACKEND_PORT:-8000}${API_V1_PREFIX:-/api/v1}
        - NEXT_PUBLIC_WS_URL=ws://${BACKEND_IP}:${BACKEND_PORT:-8000}/ws
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-PuppyForge AI}
    container_name: puppyforge-frontend
    working_dir: /app
    volumes:
      - .:/app
      - frontend_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=${ENVIRONMENT:-production}
    env_file:
      - .env.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: ["sh", "-c", "npm install && npm run build && npm run dev"]
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge

volumes:
  frontend_next:
    driver: local
  frontend_modules:
    driver: local
