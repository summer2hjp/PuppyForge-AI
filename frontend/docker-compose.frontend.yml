services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # ⚠️ Next.js 的 NEXT_PUBLIC_* 变量必须在 BUILD 时注入
        - NEXT_PUBLIC_API_URL=http://${BACKEND_IP}:${BACKEND_PORT:-8000}${API_V1_PREFIX:-/api/v1}
        - NEXT_PUBLIC_WS_URL=ws://${BACKEND_IP}:${BACKEND_PORT:-8000}/ws
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-PuppyForge AI}
    container_name: puppyforge-frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true 
    env_file:
      - .env.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: >
      sh -c "
        if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.bin/next' ]; then
          echo 'Installing dependencies...' && npm install;
        fi &&
        echo 'Starting Next.js in development mode...' && npm run dev
      "
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge

volumes:
  frontend_next:
  #frontend_modules:
  #  driver: local
