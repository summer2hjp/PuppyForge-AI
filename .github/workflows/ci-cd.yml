name: PuppyForge-AI CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'package.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  # ==================== 后端测试 & Lint ====================
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_puppyforge
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio black isort mypy

      - name: Lint (Black + isort)
        working-directory: ./backend
        run: |
          black --check .
          isort --check-only .

      - name: Type Check (mypy)
        working-directory: ./backend
        run: mypy .

      - name: Run Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_puppyforge
          SECRET_KEY: 123456
          LLM_MODEL: gpt-4o-mini
        run: pytest -v --asyncio-mode=auto

  # ==================== 前端测试 & Build ====================
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint & Type Check
        working-directory: ./frontend
        run: |
          npm run lint
          npm run type-check

      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build

  # ==================== Docker Build & Push ====================
  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            summer2hjp/puppyforge-backend:latest
            summer2hjp/puppyforge-backend:${{ github.sha }}
          cache-from: type=registry,ref=summer2hjp/puppyforge-backend:buildcache
          cache-to: type=inline

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            summer2hjp/puppyforge-frontend:latest
            summer2hjp/puppyforge-frontend:${{ github.sha }}
          cache-from: type=registry,ref=summer2hjp/puppyforge-frontend:buildcache
          cache-to: type=inline
