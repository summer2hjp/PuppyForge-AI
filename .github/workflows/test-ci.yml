# .github/workflows/test-ci.yml
name: 🔥 PuppyForge-AI 测试 CI 流水线

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: 🐍 Backend - pytest
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pytest-mock aiosqlite

      - name: 🔧 设置测试环境
        run: |
          echo "PYTHONPATH=." >> $GITHUB_ENV
          echo "TESTING=true" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite+aiosqlite:///:memory:" >> $GITHUB_ENV
          echo "QDRANT_URL=http://localhost:6333" >> $GITHUB_ENV

      - name: 🧪 运行 Backend 测试
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=backend --cov-report=xml --cov-report=term-missing
        continue-on-error: false

  frontend-test:
    name: ⚛️ Frontend - Jest
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 安装依赖
        run: npm ci

      - name: 🧪 Jest 测试
        run: npm test -- --ci --coverage --silent || true
