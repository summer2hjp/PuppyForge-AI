# .github/workflows/test-ci.yml
name: 🔥 PuppyForge-AI CI 测试流水线

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: 🐍 Backend - pytest
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: puppyforge_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pytest-mock

      - name: 🔧 设置环境变量
        run: |
          echo "PYTHONPATH=." >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/puppyforge_test" >> $GITHUB_ENV

      - name: 🧪 运行 Backend 测试
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --asyncio-mode=auto \
            -v \
            --maxfail=8

      - name: 📊 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

      - name: 📈 Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-test:
    name: ⚛️ Frontend - Jest
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🔍 类型检查 & Lint
        run: |
          npm run type-check || true
          npm run lint || true

      - name: 🧪 Jest 测试
        run: |
          npm test -- --ci --coverage

      - name: 📊 上传 Frontend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  # 可选：快速冒烟测试
  smoke-test:
    name: 🌫️ 冒烟测试 (Main)
    needs: backend-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 快速健康检查
        run: |
          cd backend
          python -c "
          from main import app
          print('✅ FastAPI 应用加载成功')
          import models
          print('✅ Models 导入成功')
          "
