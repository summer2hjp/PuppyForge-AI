# .github/workflows/test-ci.yml
name: 🔥 PuppyForge-AI CI 测试流水线

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: 🐍 Backend - pytest
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pytest-mock aiosqlite

      - name: 🔧 设置测试环境（提前）
        run: |
          echo "PYTHONPATH=." >> $GITHUB_ENV
          echo "TESTING=true" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite+aiosqlite:///:memory:" >> $GITHUB_ENV

      - name: 🧪 运行 Backend 测试
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --asyncio-mode=auto \
            -q \
            --maxfail=10
