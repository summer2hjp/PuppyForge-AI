name: 🔥 PuppyForge-AI 全栈 CI 测试核弹

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write

jobs:
  frontend-test:
    name: 🚀 Frontend Jest 狂轰
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 安装依赖
        run: npm ci

      - name: 🔍 TypeScript 检查
        run: npm run type-check

      - name: 🧪 Jest 狂测 + Coverage
        run: npm run test:ci

      - name: 📊 上传 Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: 📈 Codecov Frontend
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend

  backend-test:
    name: 🐍 Backend pytest 核弹
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖 + 测试包
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 pytest 狂轰
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing -q
