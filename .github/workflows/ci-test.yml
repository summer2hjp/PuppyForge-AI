name: PuppyForge-AI CI 测试流水线

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装Frontend依赖
        # 兼容当前锁文件中的 React Three 依赖组合
        run: npm ci --legacy-peer-deps

      - name: 运行TypeScript检查
        run: npm run type-check

      - name: 运行Jest单元测试
        run: >
          npx --yes
          -p jest
          -p ts-jest
          -p jest-environment-jsdom
          -p @types/jest
          -p @testing-library/react
          -p @testing-library/jest-dom
          -p @testing-library/user-event
          -p identity-obj-proxy
          jest --config __tests__/utils/jest.config.ts --coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  backend-test:
    name: Backend pytest 测试
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装Backend依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock pytest-cov

      - name: 运行pytest单元测试
        working-directory: ./backend
        run: |
          pytest tests/ -v --cov=. --cov-report=xml

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # 可选：合并覆盖率报告（后续可扩展）
  # coverage-report:
  #   needs: [frontend-test, backend-test]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/download-artifact@v4
