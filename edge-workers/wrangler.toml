name = "puppy-forge-edge"
main = "src/index.ts" # 如果你有独立的 worker 入口，否则 Pages 会自动处理
compatibility_date = "2024-05-24"

# 🧠 注册 Durable Object
[durable_objects]
bindings = [
  { name = "PUPPY_BRAIN", class_name = "PuppyBrain" }
]

[[migrations]]
tag = "v1"
new_classes = ["PuppyBrain"]

# 🔗 注入后端地址 (根据你的部署环境修改)
[vars]
# 本地开发时指向 Docker 宿主机的 gateway (通常是 host.docker.internal 或局域网 IP)
# 生产环境指向你的 FastAPI 服务器公网域名或内网 VPC 地址
FORGE_API_URL = "http://host.docker.internal:8000" 
INTERNAL_API_SECRET = "your_super_secret_internal_key"
