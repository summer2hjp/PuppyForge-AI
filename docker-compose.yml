version: '3.9'
services:
  forge-api:
    build: .
    ports: ["8000:8000"]
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    depends_on: [redis, qdrant]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu] # 激活 GPU 算力

  redis:
    image: redis/redis-stack:latest # 包含 Streams 和 Search
    ports: ["6379:6379"]
    
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]

volumes:
  qdrant_storage:
