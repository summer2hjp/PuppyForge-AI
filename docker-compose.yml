# ==========================================
# 🐕‍🦺 PuppyForge AI - Docker Compose 配置
# ==========================================
# 📌 使用方式:
#   开发：cp .env.example .env && docker compose up -d --build
#   生产：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==========================================

services:
  # ==================== 🗄️ PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puppy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_pg_password_!@#}
      POSTGRES_DB: ${POSTGRES_DB:-puppyforge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puppy_admin} -d ${POSTGRES_DB:-puppyforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== ⚡ Redis ====================
  redis:
    image: redis:7-alpine
    container_name: pf-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change_me_secure_redis_password_!@}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_secure_redis_password_!@#}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== 🔙 Backend (FastAPI) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: pf-backend
    env_file: .env
    environment:
      # 🔗 动态覆盖数据库/Redis 连接串（优先于 .env）
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-puppy_admin}:${POSTGRES_PASSWORD:-change_me_secure_pg_password_!@#}@postgres:5432/${POSTGRES_DB:-puppyforge_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_secure_redis_password_!@#}@redis:6379/${REDIS_DB:-0}
      # 📊 观测性
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 🔑 安全配置
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-prod}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 🛠️ 开发模式热重载（仅挂载关键源码，避免覆盖依赖）
      - ./backend/main.py:/app/main.py:ro
      - ./backend/auth.py:/app/auth.py:ro
      - ./backend/models:/app/models:ro
      - ./backend/core:/app/core:ro
      - ./backend/security:/app/security:ro
      - ./backend/gateway:/app/gateway:ro
      - ./backend/agents:/app/agents:ro
      - ./backend/forge:/app/forge:ro
      - ./backend/souls.py:/app/souls.py:ro
      - ./backend/interactions.py:/app/interactions.py:ro
      - backend_logs:/app/logs
    restart: unless-stopped
    networks:
      - puppyforge-net
    command: uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}:8000 --reload --log-level ${LOG_LEVEL:-info}

  # ==================== 🎨 Frontend (Next.js) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ Next.js 的 NEXT_PUBLIC_* 变量必须在 BUILD 时注入
        - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}${API_V1_PREFIX:-/api/v1}
        - NEXT_PUBLIC_WS_URL=ws://localhost:${BACKEND_PORT:-8000}/ws
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-PuppyForge AI}
    container_name: pf-frontend
    env_file: .env
    environment:
      # 🔒 服务端变量（不暴露给浏览器）
      - NODE_ENV=${ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== 🔄 (可选) 反向代理/网关 ====================
  # 生产环境建议启用 Traefik 或 Nginx 统一入口、TLS 与路由
  # nginx:
  #   image: nginx:alpine
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend
  #   restart: unless-stopped
  #   networks:
  #     - puppyforge-net

# ==================== 📦 持久化卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  frontend_node_modules:
    driver: local

# ==================== 🌐 网络 ====================
networks:
  puppyforge-net:
    driver: bridge
    name: puppyforge-network
