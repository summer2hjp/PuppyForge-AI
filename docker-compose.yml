# ==========================================
# 🐕‍🦺 PuppyForge AI - Docker Compose 配置
# ==========================================
# 📌 使用方式:
#   开发：cp .env.example .env && docker compose up -d --build
#   生产：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==========================================

services:
  # ==================== 🗄️ PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: puppyforge-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puppyforge123}
      POSTGRES_DB: ${POSTGRES_DB:-puppyforge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-puppyforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== ⚡ Redis ====================
  redis:
    image: redis:7-alpine
    container_name: puppyforge-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-admin@123}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin@123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== 🔙 Backend (FastAPI) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: puppyforge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin@123}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-puppyforge_db}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - puppyforge-net
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --log-level info

  # ==================== 🎨 Frontend (Next.js) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ Next.js 的 NEXT_PUBLIC_* 变量必须在 BUILD 时注入
        - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}${API_V1_PREFIX:-/api/v1}
        - NEXT_PUBLIC_WS_URL=ws://localhost:${BACKEND_PORT:-8000}/ws
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-PuppyForge AI}
    container_name: puppyforge-frontend
    working_dir: /app
    env_file: .env
    environment:
      # 🔒 服务端变量（不暴露给浏览器）
      - NODE_ENV=${ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== 🔄 (可选) 反向代理/网关 ====================
  # 生产环境建议启用 Traefik 或 Nginx 统一入口、TLS 与路由
  # nginx:
  #   image: nginx:alpine
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend
  #   restart: unless-stopped
  #   networks:
  #     - puppyforge-net

# ==================== 📦 持久化卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  frontend_node_modules:
    driver: local

# ==================== 🌐 网络 ====================
networks:
  puppyforge-net:
    driver: bridge
    name: puppyforge-network
