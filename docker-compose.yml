# ==========================================
# 🐕‍🦺 PuppyForge AI - Docker Compose 配置
# ==========================================
# 📌 使用方式:
#   开发：cp .env.example .env && docker compose up -d --build
#   生产：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==========================================

services:
  # ==================== 🗄️ PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: puppyforge-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-puppyforge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-puppyforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== ⚡ Redis ====================
  redis:
    image: redis:7-alpine
    container_name: puppyforge-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-admin123}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== 🔙 Backend (FastAPI) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: puppyforge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-puppyforge_db}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      - FRONTEND_URL=${FRONTEND_URL:-https://home.huangjp520.de5.net}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-https://oauth.huangjp520.de5.net/api/v1/auth/github/callback}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://oauth.huangjp520.de5.net/api/v1/auth/google/callback}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - puppyforge-net
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --log-level info

  # ==================== 🎨 Frontend (Next.js) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ Next.js 的 NEXT_PUBLIC_* 变量必须在 BUILD 时注入
        # PUBLIC_* 优先（外网域名），fallback 到 localhost（本地开发）
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}${API_V1_PREFIX:-/api/v1}}
        - NEXT_PUBLIC_WS_URL=${PUBLIC_WS_URL:-ws://localhost:${BACKEND_PORT:-8000}/ws}
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-PuppyForge AI}
        - NEXT_PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8000}}
    container_name: puppyforge-frontend
    working_dir: /app
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      # 🔒 服务端变量（不暴露给浏览器）
      - NODE_ENV=${ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - puppyforge-net

  # ==================== 🔄 (可选) 反向代理/网关 ====================
  # 生产环境建议启用 Traefik 或 Nginx 统一入口、TLS 与路由
  # nginx:
  #   image: nginx:alpine
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend
  #   restart: unless-stopped
  #   networks:
  #     - puppyforge-net

# ==================== 🔄 Cloudflare Tunnel (可选) ====================
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: puppyforge-tunnel
    profiles:
      - tunnel  # 仅通过 `docker compose --profile tunnel up -d` 启动
    restart: always
    network_mode: host
    command: >
      tunnel --no-autoupdate
      --edge 198.41.192.47:7844
      --edge 198.41.192.67:7844
      --edge 198.41.192.107:7844
      --edge 198.41.192.167:7844
      --edge 198.41.192.207:7844
      --edge 198.41.200.47:7844
      --edge 198.41.200.67:7844
      run --token ${CF_TUNNEL_TOKEN:?请设置 CF_TUNNEL_TOKEN}
    labels:
      - "app=puppyforge"
      - "component=tunnel"

# ==================== 📦 持久化卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  frontend_node_modules:
    driver: local

# ==================== 🌐 网络 ====================
networks:
  puppyforge-net:
    driver: bridge
    name: puppyforge-network
