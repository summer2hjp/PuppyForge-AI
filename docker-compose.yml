# ==========================================
# 🐕‍🦺 PuppyForge AI - Docker Compose 配置
# ==========================================
# 📌 使用方式:
#   开发: docker compose up -d --build
#   生产: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==========================================

services:
  # ==================== 🗄️ PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - puppyforge-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ==================== ⚡ Redis ====================
  redis:
    image: redis:7-alpine
    container_name: pf-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - puppyforge-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ==================== 🔙 Backend (FastAPI) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: pf-backend
    env_file: .env
    environment:
      # 🔗 动态覆盖数据库/Redis连接串（优先于 .env）
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/${REDIS_DB}
      # 📊 观测性
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 🛠️ 开发模式热重载（生产环境请注释或删除）
      - ./backend:/app
      - backend_logs:/app/logs
    restart: unless-stopped
    networks:
      - puppyforge-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'

  # ==================== 🎨 Frontend (Next.js) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ Next.js 的 NEXT_PUBLIC_* 变量必须在 BUILD 时注入
        - NEXT_PUBLIC_API_URL=http://backend:${BACKEND_PORT}${API_V1_PREFIX}
        - NEXT_PUBLIC_WS_URL=ws://backend:${BACKEND_PORT}/ws
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
    container_name: pf-frontend
    env_file: .env
    environment:
      # 🔒 服务端变量（不暴露给浏览器）
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    volumes:
      # 🛠️ 开发模式
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    networks:
      - puppyforge-net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'

  # ==================== 🔄 (可选) 反向代理/网关 ====================
  # 生产环境建议启用 Traefik 或 Nginx 统一入口、TLS 与路由
  # nginx:
  #   image: nginx:alpine
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend
  #   restart: unless-stopped
  #   networks:
  #     - puppyforge-net

# ==================== 📦 持久化卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  frontend_node_modules:
    driver: local

# ==================== 🌐 网络 ====================
networks:
  puppyforge-net:
    driver: bridge
    name: puppyforge-network
